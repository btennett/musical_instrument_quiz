<style>
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#F1EDE6; --surface:#FFFFFF; --ink:#1E1A16; --muted:#665E55; --line:#DDD5CA;
  --accent:#8C3B1F; --good:#1D7448; --bad:#B0281F; --good-soft:#E2F1E8; --bad-soft:#FAE6E3;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;

  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120F; --surface:#201B17; --ink:#EEE7DF; --muted:#A59B90; --line:#3A322B;

:root[data-theme="dark"]{
  --bg:#15120F; --surface:#201B17; --ink:#EEE7DF; --muted:#A59B90; --line:#3A322B;
  --accent:#F0A27E; --good:#4CC48A; --bad:#F27C70; --good-soft:#163024; --bad-soft:#3A1E1C; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{height:100%;height:100dvh;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:8px;display:flex;flex-direction:column;gap:9px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:0}
.brand em{font-style:normal;color:var(--accent)}
.score{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--ink);font-size:1rem}
.dots{display:grid;gap:5px;list-style:none;margin:0;padding:0}
.dots li{height:6px;border-radius:3px;background:var(--line)}
.dots li.now{background:var(--accent)} .dots li.ok{background:var(--good)} .dots li.no{background:var(--bad)}

.stage{overflow-y:auto;min-height:0;padding-block:4px 10px;overscroll-behavior:contain}
.card{display:flex;flex-direction:column;gap:9px}
.meta{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.question{font-family:var(--f-head);font-weight:600;font-size:clamp(1.15rem,4.8vw,1.45rem);line-height:1.3;margin:0;text-wrap:balance}

.photo-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.photo{display:block;width:100%;height:clamp(110px,calc(100vh - 490px),300px);height:clamp(110px,calc(100svh - 490px),300px);object-fit:contain;border-radius:9px;background:var(--surface)}
.photo-msg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:center;padding:0 16px}
.review .thumb{width:52px;height:40px;object-fit:cover;border-radius:6px;background:var(--bg);vertical-align:middle}
.options{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.opt{width:100%;min-height:44px;display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;
  text-align:left;padding:5px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  font-size:1rem;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s,transform .08s}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (hover:hover){.opt:not([disabled]):hover{border-color:var(--accent)}}
.opt .key{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;
  background:var(--bg);color:var(--muted)}
.opt .txt{min-width:0;line-height:1.3}
.opt .res{font-weight:800;font-size:1.05rem}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .key{background:var(--good);color:var(--surface)}
.opt.correct .res{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.wrong .res{color:var(--bad)}
.opt.faded{opacity:.5}

.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fact .verdict{font-weight:800;font-size:1.05rem;margin:0}
.fact .verdict.ok{color:var(--good)} .fact .verdict.no{color:var(--bad)}
.fact p{margin:0;font-family:var(--f-head);font-size:1rem;line-height:1.55}
.fact .credit{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.fact .credit a{color:inherit}

.over{display:flex;flex-direction:column;gap:16px}
.final{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.final .big{font-weight:800;font-size:3.2rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:0}
.final p{margin:0}
.final .best{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.row{display:flex;gap:8px}
.ghost{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (hover:hover){.ghost:hover{border-color:var(--accent)}}
.review-title{font-size:.8rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0;font-weight:500}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 52px 1fr;align-items:center;gap:12px}
.review .mark{font-weight:800;font-size:1.05rem;line-height:1.3}
.review .mark.ok{color:var(--good)} .review .mark.no{color:var(--bad)}
.review .ans{font-size:.9rem;color:var(--muted)}
.review .ans b{color:var(--ink);font-weight:600}

.actions{padding-top:8px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.btn{width:100%;border:none;border-radius:12px;min-height:50px;font-weight:700;font-size:1.1rem;cursor:pointer;
  background:var(--accent);color:var(--surface);transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:default;transform:none}
.foot{font-family:var(--f-mono);font-size:.62rem;color:var(--muted);text-align:center;margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot a{color:inherit}
.error{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:14px 16px;font-size:.92rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.fact{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
</style>

  {"name": "Crumhorn", "group": "Early instruments", "wiki": "Crumhorn", "photo": "Moderne Krummhoerner.jpg", "like": ["Shawm", "Serpent", "Recorder", "Oboe"], "fact": "A Renaissance instrument whose name means 'bent horn'. Its double reed sits inside a cap, so the player's lips never touch it."},
  {"name": "Carnyx", "group": "Early instruments", "wiki": "Carnyx", "photo": "CarnyxDeTintignac2.jpg", "like": ["Alphorn", "Serpent", "Trumpet", "Didgeridoo"], "fact": "An Iron Age Celtic bronze trumpet, held upright and about 1.8 m tall, with a bell shaped like an open-mouthed boar's head."},
  {"name": "Shawm", "group": "Early instruments", "wiki": "Shawm", "photo": "Salmaj.jpg", "like": ["Crumhorn", "Oboe", "Recorder", "Clarinet"], "fact": "A loud double-reed instrument of medieval and Renaissance times, played almost only outdoors. The oboe descends from it."},

  {"name": "Nyckelharpa", "group": "Early instruments", "wiki": "Nyckelharpa", "photo": "Nyckelharpa 0930 (cropped).jpg", "like": ["Hurdy-gurdy", "Violin", "Erhu", "Lute"], "fact": "A Swedish bowed instrument with keys that press the strings to change the pitch. The oldest surviving one dates from 1526."},

  {"name": "Sitar", "group": "World", "wiki": "Sitar", "photo": "Sitar, late 19th Century.jpg", "like": ["Lute", "Shamisen", "Bouzouki", "Erhu"], "fact": "Movable frets, plus sympathetic strings that ring along with the ones being played. Ravi Shankar made it famous outside South Asia from the late 1950s."},
  {"name": "Koto", "group": "World", "wiki": "Koto (instrument)", "photo": "Japanese Koto.jpg", "like": ["Hammered dulcimer", "Harp", "Shamisen", "Sitar"], "fact": "Japan's national instrument, derived from the Chinese zheng and se. The common type has 13 strings over movable bridges."},
  {"name": "Erhu", "group": "World", "wiki": "Erhu", "photo": "Erhu in the Mets.jpg", "like": ["Shamisen", "Violin", "Sitar", "Nyckelharpa"], "fact": "A two-stringed Chinese fiddle whose bow passes between the strings. The front of the sound box is covered with python skin."},
  {"name": "Didgeridoo", "group": "World", "wiki": "Didgeridoo", "photo": "Australiandidgeridoos.jpg", "like": ["Alphorn", "Carnyx", "Pan flute", "Serpent"], "fact": "Developed by Aboriginal peoples of northern Australia, usually from eucalyptus trunks hollowed out by termites. Players use circular breathing to keep the sound going."},
  {"name": "Kora", "group": "World", "wiki": "Kora (instrument)", "photo": "4 Koras.jpg", "like": ["Harp", "Lyre", "Sitar", "Banjo"], "fact": "A 21-string West African instrument with a body made from half a gourd covered in cowhide, traditionally played by jali (griot) families."},
  {"name": "Balalaika", "group": "World", "wiki": "Balalaika", "photo": "3 string prim balalaika.png", "like": ["Bouzouki", "Mandolin", "Shamisen", "Ukulele"], "fact": "A Russian instrument with a triangular wooden body and three strings."},
  {"name": "Tabla", "group": "World", "wiki": "Tabla", "photo": "Prop. Tabla.jpg", "like": ["Djembe", "Timpani", "Bodhrán", "Cajón"], "fact": "A pair of hand drums from the Indian subcontinent. The dark circle on each head is a tuning paste called syahi."},
  {"name": "Shamisen", "group": "World", "wiki": "Shamisen", "photo": "Man playing shamisen.jpg", "like": ["Banjo", "Erhu", "Balalaika", "Sitar"], "fact": "A three-stringed Japanese instrument played with a large plectrum called a bachi."},
  {"name": "Mbira", "group": "World", "wiki": "Mbira", "photo": "Ene mbira.jpg", "like": ["Kora", "Glockenspiel", "Xylophone", "Hammered dulcimer"], "fact": "Traditional to the Shona people of Zimbabwe: metal tines on a wooden board, plucked with the thumbs. The kalimba is a Westernised version from the 1950s."}
 ]
}
</script>

<div class="app">
  <header class="top">
    <div class="top-row">
      <h1 class="brand"><em>Instruments</em> Quiz</h1>
      <div class="score" id="scoreBox"></div>
    </div>
    <ol class="dots" id="dots" aria-hidden="true"></ol>
  </header>

  <main class="stage" id="stage">
    <section class="card" id="play">
      <div class="meta" id="cat"></div>
      <h2 class="question" id="question"></h2>
      <div class="photo-box"><img class="photo" id="photo" alt=""><div class="photo-msg" id="photoMsg" hidden></div></div>
      <ol class="options" id="options"></ol>
      <div class="fact" id="fact" hidden>
        <p class="verdict" id="verdict"></p>
        <p id="factText"></p>
        <p class="credit"><a id="credit" href="#" target="_blank" rel="noopener">Photo: Wikimedia (author and licence)</a></p>
      </div>
    </section>

    <section class="over" id="over" hidden>
      <div class="final">
        <p class="big" id="finalScore"></p>
        <p id="finalMsg"></p>
        <p class="best" id="best"></p>
      </div>
      <div class="row">
        <button class="ghost" id="shareBtn" type="button">Share score</button>
      </div>
      <h2 class="review-title">Your answers</h2>
      <ol class="review" id="review"></ol>
    </section>
  </main>

  <footer class="actions">
    <button class="btn" id="mainBtn" type="button" disabled>Pick an answer</button>
    <p class="foot" id="foot"></p>
  </footer>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script>
// ---------- Load and check the content ----------
const $ = id => document.getElementById(id);
const KEYS = "ABCDEF";
let DATA, ITEMS = [], PER = 12, NOPT = 5, TRICKY = 3, SHOWGROUP = false;
const shuffle = a => { a = [...a]; for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };

try {
  DATA = JSON.parse($("quiz-data").textContent);
  PER = Math.max(1, +(DATA.settings && DATA.settings.questionsPerGame) || 12);
  NOPT = Math.min(6, Math.max(3, +(DATA.settings && DATA.settings.optionsPerQuestion) || 5));
  const t = DATA.settings && DATA.settings.trickyChoices;
  TRICKY = Math.max(0, t === undefined ? 3 : +t || 0);
  SHOWGROUP = !!(DATA.settings && DATA.settings.showGroup);
  (DATA.items || []).forEach((b, n) => {
    if (!b.name || !(b.wiki || b.photo)) console.warn(`Item ${n + 1} skipped: missing name, or both wiki and photo.`);
    else ITEMS.push(b);
  });
} catch (e) {
  console.error(e);
}

// ---------- Photos ----------
// An item with "photo" uses that Commons file (resized by Commons). Otherwise the quiz asks the
// Wikipedia API for the main photo of the "wiki" article (free licences only),
// resized to 1200px wide so phones don't download full-size originals.
// If an article has no main photo, or a photo won't load, the quiz falls back to
// the other Commons photos used in the same article (wider than tall first).
const API = "https://en.wikipedia.org/w/api.php";
const commonsSrc = (file, width) => "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file) + "?width=" + width;
const filePage = (file, site) => `https://${site}/wiki/File:` + encodeURIComponent(file.replace(/ /g, "_"));
const api = async params => {
  const r = await fetch(API + "?" + new URLSearchParams({ format: "json", formatversion: "2", origin: "*", ...params }));
  if (!r.ok) throw new Error("Wikipedia answered " + r.status);
  return (await r.json()).query || {};
};

// Other free (Commons) JPEG photos in an article, best candidates first.
async function articlePhotos(title, width, skip) {
  const q = await api({ action: "query", redirects: "1", generator: "images", titles: title, gimlimit: "max",
    prop: "imageinfo", iiprop: "url|size|mime", iiurlwidth: String(width) });
  return (q.pages || [])
    .filter(pg => pg.imagerepository === "shared" && pg.imageinfo && pg.imageinfo[0].mime === "image/jpeg")
    .map(pg => { const ii = pg.imageinfo[0]; return { file: pg.title.replace(/^File:/, ""), src: ii.thumburl || ii.url, w: ii.width, h: ii.height }; })
    .filter(c => c.file !== skip && Math.max(c.w, c.h) >= 600)
    .sort((x, y) => ((y.w >= y.h * 1.15) - (x.w >= x.h * 1.15)) || (y.w * y.h - x.w * x.h));
}

// Move an item on to its next fallback photo. Returns false when none are left.
async function nextPhoto(b) {
  if (!b.wiki) return false;
  if (!b.alts) { try { b.alts = await articlePhotos(b.wiki, 1200, b.file); } catch (e) { b.alts = []; } }
  const c = b.alts.shift();
  if (!c) return false;
  b.file = c.file; b.src = c.src; b.credit = filePage(c.file, "commons.wikimedia.org");
  console.warn(`"${b.name}": using another photo from the article, ${c.file}`);
  return true;
}

async function loadPhotos() {
  ITEMS.forEach(b => { if (b.photo) { b.file = b.photo; b.src = commonsSrc(b.photo, 1200); b.credit = filePage(b.photo, "commons.wikimedia.org"); } });
  const titles = [...new Set(ITEMS.filter(b => !b.photo).map(b => b.wiki))];
  const found = {};
  for (let k = 0; k < titles.length; k += 50) {
    const q = await api({ action: "query", redirects: "1", prop: "pageimages", piprop: "thumbnail|name", pithumbsize: "1200",
      pilicense: "free", titles: titles.slice(k, k + 50).join("|") });
    const alias = {};
    [...(q.normalized || []), ...(q.redirects || [])].forEach(a => { alias[a.from] = a.to; });
    const pages = {};
    (q.pages || []).forEach(pg => { pages[pg.title] = pg; });
    titles.slice(k, k + 50).forEach(t => {
      let x = t; for (let n = 0; n < 3 && alias[x]; n++) x = alias[x];
      const pg = pages[x];
      if (pg && pg.thumbnail && pg.pageimage) found[t] = pg;
    });
  }
  await Promise.all(ITEMS.map(async b => {
    if (b.photo) return;
    const pg = found[b.wiki];
    if (pg) { b.file = pg.pageimage.replace(/_/g, " "); b.src = pg.thumbnail.source; b.credit = filePage(pg.pageimage, "en.wikipedia.org"); }
    else if (!(await nextPhoto(b))) console.warn(`No photo found for "${b.name}" (article "${b.wiki}"). Left out of the quiz.`);
  }));
  ITEMS = ITEMS.filter(b => b.src);
}

// Build a question with wrong answers taken from other instruments,
// preferring the same group so the choices are plausible.
function makeQuestion(b) {
  const others = ITEMS.filter(o => o.name !== b.name), have = new Set(others.map(o => o.name));
  const tricky = shuffle((b.like || []).filter(n => have.has(n))).slice(0, TRICKY);
  const same = shuffle(others.filter(o => o.group === b.group).map(o => o.name));
  const rest = shuffle(others.filter(o => o.group !== b.group).map(o => o.name));
  const wrong = [...new Set([...tricky, ...same, ...rest])].slice(0, NOPT - 1);
  return { category: b.group || "Instruments", q: "Which instrument is this?", item: b,
           answer: b.name, options: [b.name, ...wrong], fact: b.fact };
}

// ---------- Game ----------
let round = [], i = 0, score = 0, answers = [], picked = false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const total = () => round.length;

function header() {
  const done = !$("over").hidden;
  $("scoreBox").innerHTML = done ? `Done · Score <b>${score}</b>`
    : `Q <b>${Math.min(i + 1, total())}</b>/${total()} · Score <b>${score}</b>`;
  $("dots").style.gridTemplateColumns = `repeat(${total()},1fr)`;
  $("dots").innerHTML = round.map((_, k) => {
    const c = k < answers.length ? (answers[k].ok ? "ok" : "no") : (k === i && !done ? "now" : "");
    return `<li class="${c}"></li>`;
  }).join("");
}

// Show the photo, with a message while it loads or if it fails.
// If the photo fails, try the next photo from the same article.
function setPhoto(x) {
  const img = $("photo"), msg = $("photoMsg"), at = i, b = x.item;
  msg.textContent = "Fetching the photo…"; msg.hidden = false;
  img.onload = () => { if (at === i) msg.hidden = true; };
  img.onerror = async () => {
    if (at !== i) return;
    if (await nextPhoto(b)) { if (at === i) img.src = b.src; }
    else if (at === i) msg.textContent = "This photo wouldn't load. Pick any answer to move on.";
  };
  img.src = b.src;
}

function show() {
  const x = round[i];
  picked = false;
  x._order = shuffle(x.options);
  $("cat").textContent = SHOWGROUP ? x.category : `Question ${i + 1}`;
  setPhoto(x);
  $("question").textContent = x.q;
  $("options").innerHTML = x._order.map((o, k) =>
    `<li><button class="opt" type="button" id="opt-${k}" data-v="${esc(o)}"><span class="key">${KEYS[k]}</span><span class="txt">${esc(o)}</span><span class="res" aria-hidden="true"></span></button></li>`
  ).join("");
  $("fact").hidden = true;
  const b = $("mainBtn"); b.disabled = true; b.textContent = "Pick an answer";
  $("stage").scrollTop = 0;
  header();
}

function choose(value) {
  if (picked) return;
  picked = true;
  const x = round[i], ok = value === x.answer;
  if (ok) score++;
  answers.push({ x, value, ok });
  buzz(ok ? 20 : [30, 40, 30]);

  document.querySelectorAll(".opt").forEach(btn => {
    const v = btn.dataset.v; btn.disabled = true;
    if (v === x.answer) { btn.classList.add("correct"); btn.querySelector(".res").textContent = "✓"; }
    else if (v === value) { btn.classList.add("wrong"); btn.querySelector(".res").textContent = "✗"; }
    else btn.classList.add("faded");
  });

  const vd = $("verdict");
  vd.textContent = ok ? "Correct!" : `Not quite. It's the ${x.answer.toLowerCase()}.`;
  vd.className = "verdict " + (ok ? "ok" : "no");
  $("factText").textContent = x.fact || "";
  $("factText").hidden = !x.fact;
  $("credit").href = x.item.credit;
  $("fact").hidden = false;
  $("live").textContent = vd.textContent + " " + (x.fact || "");

  const b = $("mainBtn");
  b.disabled = false;
  b.textContent = i === total() - 1 ? "See your results →" : "Next question →";
  b.focus({ preventScroll: true });
  header();
  requestAnimationFrame(() => $("fact").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" }));
}

function finish() {
  $("play").hidden = true; $("over").hidden = false;
  const n = total(), pct = score / n;
  $("finalScore").textContent = `${score}/${n}`;
  $("finalMsg").textContent = pct >= .9 ? "Outstanding. Take a bow." : pct >= .7 ? "Great result. You know your instruments." : pct >= .5 ? "Solid effort. Have another go." : "A tough set. Every round is different, so try again.";
  let best = score;
  try { const key = "instruments-best-" + (DATA.version || "1"); best = Math.max(score, +(localStorage.getItem(key) || 0)); localStorage.setItem(key, best); } catch (e) {}
  $("best").textContent = `Best score on this device: ${best}/${n}`;
  $("review").innerHTML = answers.map(a =>
    `<li><span class="mark ${a.ok ? "ok" : "no"}" aria-label="${a.ok ? "correct" : "wrong"}">${a.ok ? "✓" : "✗"}</span><img class="thumb" src="${esc(a.x.item.src)}" alt="Photo of the ${esc(a.x.answer.toLowerCase())}">
     <span class="ans">${a.ok ? `<b>${esc(a.x.answer)}</b>` : `You said ${esc(a.value)} · answer: <b>${esc(a.x.answer)}</b>`}</span></li>`
  ).join("");
  $("shareBtn").textContent = "Share score";
  const b = $("mainBtn"); b.disabled = false; b.textContent = "Play again ↻"; b.focus({ preventScroll: true });
  $("stage").scrollTop = 0;
  header();
}

function start() {
  round = shuffle(ITEMS).slice(0, Math.min(PER, ITEMS.length)).map(makeQuestion);
  i = 0; score = 0; answers = [];
  $("over").hidden = true; $("play").hidden = false;
  round.slice(1).forEach(x => { new Image().src = x.item.src; });   // preload the rest of the round
  show();
}

// Share the score with the phone's share sheet, or copy it if that isn't available.
async function share() {
  const text = `I scored ${score}/${total()} on the Musical Instruments Quiz.`;
  try { if (navigator.share) { await navigator.share({ text }); return; } }
  catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); $("shareBtn").textContent = "Copied ✓"; }
  catch (e) { $("shareBtn").textContent = "Couldn't share"; }
}

$("shareBtn").addEventListener("click", share);
$("options").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) choose(b.dataset.v); });
$("mainBtn").addEventListener("click", () => {
  if (!$("over").hidden) start();
  else if (picked) { if (i < total() - 1) { i++; show(); } else finish(); }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "A" || !round.length) return;
  const k = e.key.toUpperCase(), idx = KEYS.indexOf(k);
  if (!picked && $("over").hidden && idx > -1 && idx < (round[i]?._order.length || 0) && k.length === 1) { e.preventDefault(); choose(round[i]._order[idx]); }
  else if (e.key === "Enter" && !$("mainBtn").disabled && document.activeElement !== $("mainBtn") && !(document.activeElement && document.activeElement.closest(".ghost"))) { e.preventDefault(); $("mainBtn").click(); }
});

function fail(msg) {
  $("play").innerHTML = `<div class="error">${msg}</div>`;
  $("mainBtn").textContent = "No questions loaded";
}

(async () => {
  if (ITEMS.length < 5) return fail("The quiz content couldn't be loaded. Check the quiz-data block for a JSON typo, such as a missing comma or quote.");
  $("question").textContent = "Tuning up…";
  $("photoMsg").textContent = "Looking up photos on Wikipedia…"; $("photoMsg").hidden = false;
  try { await loadPhotos(); }
  catch (e) { console.error(e); return fail("Couldn't reach Wikipedia to fetch the photos. Check your connection and reload the page."); }
  if (ITEMS.length < 5) return fail("Too few photos could be found on Wikipedia. Reload the page to try again.");
  $("foot").textContent = `${ITEMS.length} instruments · photos & facts: Wikimedia · v${(DATA.version || "1").split(" ")[0]}`;
  start();
})();
</script>
</body>
</html>
